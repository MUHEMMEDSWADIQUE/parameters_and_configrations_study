# =============================================================================
# Parameter Lab — Databricks Asset Bundle (DAB)
# =============================================================================
# Purpose: Teaching laboratory for advanced parameter passing, configuration
# management, dynamic configuration, and parameter propagation across SQL,
# Python, Lakeflow Declarative Pipelines (SDP), and Databricks Workflows.
#
# Concepts demonstrated in THIS file:
#   - Bundle name and identity
#   - Bundle-level variables (visible to all targets)
#   - Workspace root_path and artifact_path
#   - Include directives for modular YAML
#   - Target definitions with variable overrides (parameter precedence)
#   - Artifact (wheel) configuration
#
# Variable reference syntax:
#   ${var.<name>}          → bundle variable
#   ${workspace.current_user.name} → built-in bundle expression
#   ${bundle.name}         → built-in bundle expression
#   ${bundle.target}       → current target name (dev|test|prod)
# =============================================================================

bundle:
  name: parameter_lab

# -----------------------------------------------------------------------------
# Bundle-level variables
#
# These are defined at the top level and inherited by every target.
# A target can override any of them (see resources/environments/*.yml).
#
# Precedence (lowest → highest):
#   1. CLI flag: --var="key=value"
#   2. Target-level variable override
#   3. Bundle-level default
#
# You can also pass variables at deploy time:
#   databricks bundle deploy --var="catalog=main" --var="schema=my_schema"
# -----------------------------------------------------------------------------
variables:
  catalog:
    description: "Unity Catalog catalog for all objects created by this bundle."
    default: main

  schema:
    description: "Schema within the catalog. Overridden per target (dev/test/prod)."
    default: parameter_lab

  environment:
    description: "Logical environment name. Propagated to Spark conf via pipeline configuration."
    default: dev

  source_path:
    description: "UC Volume path for raw source files."
    default: /Volumes/main/parameter_lab/raw

  processing_mode:
    description: "Pipeline processing mode: incremental | full. Prod uses full."
    default: incremental

  pipeline_name:
    description: "Name of the SDP pipeline resource."
    default: parameter_lab_pipeline

  job_name:
    description: "Name of the workflow job resource."
    default: parameter_lab_job

# -----------------------------------------------------------------------------
# Additional variables defined in a separate file for modularity.
# See resources/variables.yml for JSON-typed and complex variables.
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Workspace configuration
#
# root_path:  Where deployed assets live in the workspace.
# artifact_path: Where built artifacts (wheels) are uploaded.
# file_path:  The local source root that gets synced to the workspace.
# -----------------------------------------------------------------------------
workspace:
  root_path: /Workspace/Users/${workspace.current_user.name}/.bundle/${bundle.name}
  artifact_path: /Workspace/Users/${workspace.current_user.name}/.bundle/${bundle.name}/artifacts
  file_path: /Workspace/Users/${workspace.current_user.name}/parameter-lab/src

# -----------------------------------------------------------------------------
# Artifacts — build a Python wheel for the common utilities package.
# This wheel is installed on clusters running the pipeline and job tasks,
# so they can `from parameter_lab_common import config, validation, ...`
# -----------------------------------------------------------------------------
artifacts:
  parameter_lab_common:
    type: whl
    path: ./src/common
    build: python setup.py bdist_wheel
    files:
      - ./src/common/setup.py

# -----------------------------------------------------------------------------
# Include directives — pull in modular YAML files.
# resources/*.yml matches: jobs.yml, pipelines.yml, variables.yml
# resources/environments/*.yml matches: dev.yml, test.yml, prod.yml
# -----------------------------------------------------------------------------
include:
  - resources/*.yml
  - resources/environments/*.yml

# -----------------------------------------------------------------------------
# Targets
#
# Each target overrides variables to demonstrate environment-specific config.
# The same code (SQL, Python, pipeline) behaves differently depending on
# which target is deployed.
#
# Deploy with:
#   databricks bundle deploy -t dev
#   databricks bundle deploy -t test
#   databricks bundle deploy -t prod
#
# The actual target definitions live in resources/environments/*.yml for
# modularity. They are merged into this file at validation/deploy time.
#
# Key concept: ${bundle.target} resolves to the current target name at deploy
# time, and can be used inside resource definitions (see pipelines.yml, jobs.yml).
# -----------------------------------------------------------------------------