# =============================================================================
# resources/pipelines.yml — Lakeflow Declarative Pipeline (SDP) definition
# =============================================================================
# This file defines the `parameter_lab_pipeline` resource.
#
# KEY PARAMETER CONCEPTS:
#
# 1. DEPLOY-TIME SUBSTITUTION (${var.xxx}):
#    DAB replaces ${var.catalog}, ${var.schema}, etc. when the bundle is
#    deployed. The deployed SQL/Python files contain literal values — they
#    are NOT runtime parameters. This is why `dev` deploys with schema
#    `parameter_lab_dev` and `prod` deploys with `parameter_lab_prod`.
#
# 2. RUNTIME PIPELINE CONFIGURATION (configuration: section below):
#    These are Spark configuration key-value pairs set on every cluster in
#    the pipeline. They are accessible at RUNTIME via:
#      Python:  spark.conf.get("parameter_lab.catalog")
#      SQL:     NOT directly accessible (see SQL file comments)
#
# 3. LIBRARIES (SQL + Python files):
#    The pipeline loads both SQL and Python source files. DAB deploys them
#    to the workspace, and the SDP engine reads them at pipeline run time.
#    The `${var.xxx}` substitution happens BEFORE deployment (deploy-time).
#
# 4. The pipeline mixes SQL and Python datasets so you can observe how
#    parameters flow through both languages.
# =============================================================================

resources:
  pipelines:
    parameter_lab_pipeline:
      name: ${var.pipeline_name}_${bundle.target}

      # ---------------------------------------------------------------------
      # Pipeline configuration → Spark conf keys available at RUNTIME.
      # These use ${var.xxx} deploy-time substitution to inject target-specific
      # values into the pipeline's Spark configuration.
      #
      # Access pattern:
      #   Python:  spark.conf.get("parameter_lab.catalog")
      #   Python:  spark.conf.get("parameter_lab.schema")
      #   SQL:     These are NOT accessible via SQL — this is a documented
n      #            limitation. SQL files use ${var.xxx} deploy-time substitution
      #            instead. See src/sdp/sql/01_parameters.sql for full explanation.
      # ---------------------------------------------------------------------
      configuration:
        parameter_lab.environment: ${var.environment}
        parameter_lab.catalog: ${var.catalog}
        parameter_lab.schema: ${var.schema}
        parameter_lab.source_path: ${var.source_path}
        parameter_lab.processing_mode: ${var.processing_mode}
        parameter_lab.max_files_per_trigger: ${var.max_files_per_trigger}
        parameter_lab.enable_quality_checks: ${var.enable_quality_checks}
        parameter_lab.retention_days: ${var.retention_days}
        parameter_lab.bronze_suffix: ${var.bronze_suffix}
        parameter_lab.silver_suffix: ${var.silver_suffix}
        parameter_lab.gold_suffix: ${var.gold_suffix}
        parameter_lab.target: ${bundle.target}

      # ---------------------------------------------------------------------
      # SQL source files — deploy-time substitution applies.
      # ${var.catalog} and ${var.schema} become literal strings in the deployed
      # file, so each target gets its own table names.
      # ---------------------------------------------------------------------
      libraries:
        # SQL files (executed in order by file name)
        - file:
            path: ../src/sdp/sql/01_parameters.sql
        - file:
            path: ../src/sdp/sql/02_dynamic_source.sql
        - file:
            path: ../src/sdp/sql/03_dynamic_target.sql
        - file:
            path: ../src/sdp/sql/04_parameter_expressions.sql
        - file:
            path: ../src/sdp/sql/05_parameter_metadata.sql

        # Python files (executed in order by file name)
        - file:
            path: ../src/sdp/python/01_parameters.py
        - file:
            path: ../src/sdp/python/02_dynamic_source.py
        - file:
            path: ../src/sdp/python/03_dynamic_target.py
        - file:
            path: ../src/sdp/python/04_parameter_validation.py
        - file:
            path: ../src/sdp/python/05_metadata_driven.py

      # ---------------------------------------------------------------------
      # Cluster defaults (overridden per-target in environments/*.yml)
      # ---------------------------------------------------------------------
      clusters:
        - label: default
          autoscale:
            min_instances: 1
            max_instances: 3

      # Continuous vs triggered
      continuous: false

      # Development mode for dev target, production for others
      development: ${var.environment == "dev"}

      # ---------------------------------------------------------------------
      # Notifications (prod only)
      # ---------------------------------------------------------------------
      notifications:
        - alerts: ["on-update-failure"]
          email_recipients: []  # Add your email for prod target
