# =============================================================================
# resources/environments/prod.yml — Production target
# =============================================================================
# Prod uses `full` processing mode and longer retention.
# Deploy with:  databricks bundle deploy -t prod
#
# Notice that `processing_mode` is `full` here but `incremental` in dev/test.
# The same SDP pipeline code checks `spark.conf.get("parameter_lab.processing_mode")`
# and adapts its behaviour at runtime — no code change needed.
# =============================================================================

targets:
  prod:
    description: "Production environment — schema suffix _prod, full reload mode"
    variables:
      catalog: main
      schema: parameter_lab_prod
      environment: prod
      source_path: /Volumes/main/parameter_lab/raw
      processing_mode: full
      max_files_per_trigger: "500"
      enable_quality_checks: "true"
      retention_days: "365"

    workspace:
      root_path: /Workspace/Users/${workspace.current_user.name}/.bundle/${bundle.name}/prod

    resources:
      pipelines:
        parameter_lab_pipeline:
          clusters:
            - label: default
              autoscale:
                min_instances: 2
                max_instances: 5
