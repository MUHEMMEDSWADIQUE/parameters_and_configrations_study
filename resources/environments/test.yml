# =============================================================================
# resources/environments/test.yml — Test / Staging target
# =============================================================================
# Same code, different configuration. When you run:
#   databricks bundle deploy -t test
# every ${var.schema} resolves to `parameter_lab_test`, proving that the
# same bundle code adapts to the target.
# =============================================================================

targets:
  test:
    description: "Test / staging environment — schema suffix _test, incremental mode"
    variables:
      catalog: main
      schema: parameter_lab_test
      environment: test
      source_path: /Volumes/main/parameter_lab/raw
      processing_mode: incremental
      max_files_per_trigger: "100"
      enable_quality_checks: "true"
      retention_days: "30"

    workspace:
      root_path: /Workspace/Users/${workspace.current_user.name}/.bundle/${bundle.name}/test

    resources:
      pipelines:
        parameter_lab_pipeline:
          clusters:
            - label: default
              autoscale:
                min_instances: 1
                max_instances: 3
