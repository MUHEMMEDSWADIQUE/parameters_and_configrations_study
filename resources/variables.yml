# =============================================================================
# resources/variables.yml — Additional bundle variables
# =============================================================================
# This file is included via `include: - resources/*.yml` in databricks.yml.
# Variables defined here are merged with those in databricks.yml.
#
# Demonstrates:
#   - Complex / JSON-typed variables
#   - Variables with rich defaults
#   - Variables used for dynamic configuration
# =============================================================================

variables:
  # JSON-typed variable: passed as a string but parsed as JSON at runtime.
  json_config:
    description: "JSON configuration string for dynamic pipeline behavior."
    default: |
      {
        "source": "azure_sql",
        "schema": "retail",
        "table": "customer",
        "load_type": "incremental",
        "watermark_column": "modified_date"
      }

  # Numeric variable
  max_files_per_trigger:
    description: "Maximum files processed per trigger in streaming pipelines."
    default: "100"

  # Boolean-like variable (string in DAB, parsed at runtime)
  enable_quality_checks:
    description: "Whether to enable data quality expectations."
    default: "true"

  # Variable with no default — MUST be provided at deploy time.
  # Deploy: databricks bundle deploy -t dev --var="retention_days=30"
  retention_days:
    description: "Delta table retention in days. No default — must be provided at deploy time or in target override."

  # Variable referencing another variable (DAB expression)
  full_source_path:
    description: "Fully qualified source path combining catalog and volume."
    default: /Volumes/${var.catalog}/parameter_lab/raw

  # Variable used for dynamic table naming
  bronze_suffix:
    description: "Suffix for bronze-layer tables."
    default: _bronze

  silver_suffix:
    description: "Suffix for silver-layer tables."
    default: _silver

  gold_suffix:
    description: "Suffix for gold-layer tables."
    default: _gold